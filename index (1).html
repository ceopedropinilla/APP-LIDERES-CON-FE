<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a3441" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Líderes con Fe</title>
    <meta name="description" content="Líderes con Fe — discernimiento, oración y mayordomía para empresarios católicos." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Líderes con Fe" />
    <meta property="og:description" content="Discernimiento, oración y mayordomía para empresarios católicos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Líderes con Fe" />
    <meta name="twitter:description" content="Discernimiento, oración y mayordomía para empresarios católicos." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      .app-boot-loading {
        align-items: center;
        background: radial-gradient(circle at top, rgba(224, 207, 168, 0.34), transparent 35%), #eeeae2;
        color: #6f7b87;
        display: flex;
        font: 500 14px/1.4 Inter, system-ui, sans-serif;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
      }

      .app-boot-loading__status {
        align-items: center;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid #e5e0d7;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(38, 56, 77, 0.08);
        display: flex;
        gap: 12px;
        padding: 12px 16px;
      }

      .app-boot-loading__spinner {
        animation: app-boot-spin 0.8s linear infinite;
        border: 2px solid rgba(38, 56, 77, 0.18);
        border-radius: 50%;
        border-top-color: #26384d;
        height: 16px;
        width: 16px;
      }

      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loading">
        <div class="app-boot-loading__status" role="status" aria-live="polite">
          <span class="app-boot-loading__spinner" aria-hidden="true"></span>
          Preparando tu espacio...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
